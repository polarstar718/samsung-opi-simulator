  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body class="bg-navy-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useMemo } = React;

    // ==========================================
    // 유틸리티 함수: 한국 원화 및 수치 포맷팅
    // ==========================================
    function formatKoreanWon(amount) {
      if (amount === 0 || isNaN(amount)) return '0원';
      const isNegative = amount < 0;
      const abs = Math.abs(Math.round(amount));
      
      const eok = Math.floor(abs / 100000000);
      const man = Math.floor((abs % 100000000) / 10000);
      const rest = Math.round(abs % 10000);
      
      let parts = [];
      if (eok > 0) parts.push(`${eok.toLocaleString()}억`);
      if (man > 0) parts.push(`${man.toLocaleString()}만`);
      if (parts.length === 0 && rest > 0) parts.push(`${rest.toLocaleString()}`);
      
      const res = (isNegative ? '-' : '') + parts.join(' ') + ' 원';
      return res.trim();
    }

    function formatNumber(val) {
      if (val === null || val === undefined || isNaN(val)) return '0';
      return Math.round(val).toLocaleString();
    }

    // ==========================================
    // 세금 계산 로직
    // ==========================================
    // 근로소득공제 (총급여액 기준)
    function calcEarnedIncomeDeduction(totalSalary) {
      if (totalSalary <= 5000000) return totalSalary * 0.7;
      if (totalSalary <= 15000000) return 3500000 + (totalSalary - 5000000) * 0.4;
      if (totalSalary <= 45000000) return 7500000 + (totalSalary - 15000000) * 0.15;
      if (totalSalary <= 100000000) return 12000000 + (totalSalary - 45000000) * 0.05;
      const ded = 14750000 + (totalSalary - 100000000) * 0.02;
      return Math.min(ded, 20000000); // 법정 최고 한도 2천만 원
    }

    // 대한민국 종합소득세 과세표준 구간 산출세액 (2024~2026 현행)
    function calcBaseIncomeTax(taxableIncome) {
      if (taxableIncome <= 0) return 0;
      if (taxableIncome <= 14000000) return taxableIncome * 0.06;
      if (taxableIncome <= 50000000) return taxableIncome * 0.15 - 1260000;
      if (taxableIncome <= 88000000) return taxableIncome * 0.24 - 5760000;
      if (taxableIncome <= 150000000) return taxableIncome * 0.35 - 15440000;
      if (taxableIncome <= 300000000) return taxableIncome * 0.38 - 19940000;
      if (taxableIncome <= 500000000) return taxableIncome * 0.40 - 25940000;
      if (taxableIncome <= 1000000000) return taxableIncome * 0.42 - 35940000;
      return taxableIncome * 0.45 - 65940000;
    }

    // OPI 1 정밀 한계세액 계산
    function calcOPI1Tax(baseSalary, opi1Gross) {
      if (opi1Gross <= 0) {
        return { incomeTax: 0, localTax: 0, healthTax: 0, totalTax: 0, netCash: 0, effectiveRate: 0, taxBracket: '0%' };
      }
      const personalDed = 1500000; // 본인 기본 인적공제
      
      // 1. 기본급여만 있을 때 과세표준 & 산출세액
      const ded1 = calcEarnedIncomeDeduction(baseSalary);
      const taxBase1 = Math.max(0, baseSalary - ded1 - personalDed);
      const tax1 = calcBaseIncomeTax(taxBase1);
      
      // 2. 기본급여 + OPI 1 합산 총급여 과세표준 & 산출세액
      const totalGross = baseSalary + opi1Gross;
      const ded2 = calcEarnedIncomeDeduction(totalGross);
      const taxBase2 = Math.max(0, totalGross - ded2 - personalDed);
      const tax2 = calcBaseIncomeTax(taxBase2);
      
      // 한계 소득세
      const marginalIncomeTax = Math.max(0, tax2 - tax1);
      // 지방소득세 10%
      const localTax = marginalIncomeTax * 0.10;
      // 건강보험료 (요청 지정값 4.967%)
      const healthTax = opi1Gross * 0.04967;
      
      const totalTax = marginalIncomeTax + localTax + healthTax;
      const netCash = opi1Gross - totalTax;
      const effectiveRate = opi1Gross > 0 ? (totalTax / opi1Gross) * 100 : 0;
      
      let taxBracket = '6%';
      if (taxBase2 > 1000000000) taxBracket = '45%';
      else if (taxBase2 > 500000000) taxBracket = '42%';
      else if (taxBase2 > 300000000) taxBracket = '40%';
      else if (taxBase2 > 150000000) taxBracket = '38%';
      else if (taxBase2 > 88000000) taxBracket = '35%';
      else if (taxBase2 > 50000000) taxBracket = '24%';
      else if (taxBase2 > 14000000) taxBracket = '15%';

      return {
        marginalIncomeTax,
        localTax,
        healthTax,
        totalTax,
        netCash,
        effectiveRate,
        taxBracket,
        taxBase2
      };
    }

    // OPI 2 세금 계산 (최고세율 54.467% 주식으로 선공제 -> 45.533% 세후 주식 수령)
    function calcOPI2Tax(opi2Gross) {
      if (opi2Gross <= 0) {
        return {
          incomeTax: 0,
          localTax: 0,
          healthTax: 0,
          totalTax: 0,
          netStockValue: 0,
          effectiveRate: 54.467
        };
      }
      const incomeTax = opi2Gross * 0.45;
      const localTax = opi2Gross * 0.045;
      const healthTax = opi2Gross * 0.04967;
      const totalTax = opi2Gross * 0.54467;
      const netStockValue = opi2Gross * 0.45533;
      return {
        incomeTax,
        localTax,
        healthTax,
        totalTax,
        netStockValue,
        effectiveRate: 54.467
      };
    }

    // ==========================================
    // 최신 증권가 컨센서스 및 리포트 기반 시나리오 프리셋 정의
    // (Key는 수령연도 2027~2031년이며, 각각 전년도인 2026~2030년 영업이익 실적이 재원이 됨)
    // ==========================================
    const SCENARIOS = {
      default: {
        name: '📊 증권가 컨센서스 기본 (370~550조)',
        description: '26년 실적 370조(→27년 수령) 달성 후, HBM4 양산 및 빅테크 5년 장기공급계약(LTA)으로 27년 550조·28년 500조대 이익 체력 유지 (FnGuide 컨센서스 기반)',
        profits: { 2027: 370, 2028: 550, 2029: 500, 2030: 480, 2031: 520 }
      },
      supercycle: {
        name: '🔥 긍정론: AI 슈퍼사이클 (370~750조)',
        description: '현대차·삼성증권 등 긍정론: 26년 370조에 이어 에이전틱 AI 확산 및 데이터센터 증설 병목 지속으로 27년 570조 → 28년 610조 돌파 후 지속 우상향',
        profits: { 2027: 370, 2028: 570, 2029: 610, 2030: 680, 2031: 750 }
      },
      conservative: {
        name: '🛡️ 신중론: 피크아웃 조정 (280~540조)',
        description: 'BNK·NH투자증권 등 신중론: 26년 370조 → 27년 540조 정점 통과 후 메모리 증설 물량 유입 및 수급 완화로 완만한 감익 조정',
        profits: { 2027: 370, 2028: 540, 2029: 420, 2030: 320, 2031: 280 }
      },
      downturn: {
        name: '⚠️ 다운턴: 100조 허들 테스트 (95~370조)',
        description: '26년 370조 이후 글로벌 AI 인프라 투자 급감 가정 시 29년 실적(→30년 수령) 일시적 100조 이하(95조, OPI 2 미발동) 하락 구간 스트레스 테스트',
        profits: { 2027: 370, 2028: 220, 2029: 120, 2030: 95, 2031: 180 }
      }
    };

    // ==========================================
    // 메인 리액트 컴포넌트
    // ==========================================
    function App() {
      // 1. 사용자 입력 파라미터 상태
      const [headcounts, setHeadcounts] = useState({
        memory: 32500,
        common: 22500,
        nonMemory: 22500
      });
      const [baseSalaryManwon, setBaseSalaryManwon] = useState(10000); // 2027년 시작 계약연봉: 기본 10,000만 원 (1억 원, 최대 1.2억 샐러리캡)
      const [salaryGrowthRate, setSalaryGrowthRate] = useState(5); // 연간 연봉 상승률 (기본 연 5%)
      const [stockPrice, setStockPrice] = useState(220000); // 삼성전자 기준 주가 (2026년 20만 원 상회 및 컨센서스 반영: 기본 220,000원)
      const [stockGrowthRate, setStockGrowthRate] = useState(0); // 연간 주가 상승률 (기본 0%, -10% ~ +30% 조절 가능)

      // PSU (Performance Stock Unit) 약정 설정: CL2 총 400주, CL3·4 총 600주 -> 2028·2029·2030년 10월에 1/3씩 분할 수령
      const [psuTotalShares, setPsuTotalShares] = useState(600); // 총 약정 주식 수 (CL3·4 기본 600주, CL2 400주)
      // psuTaxMode: 'opi1_cash' (다음 해 연말정산 시 OPI 1 현금에서 우선 차감 - 기본) vs 'opi2_stock' (다음 해 OPI 2 주식 수 차감 우선)
      const [psuTaxMode, setPsuTaxMode] = useState('opi1_cash');

      // 5개년 연도별 영업이익 (조 원)
      const [opProfits, setOpProfits] = useState(SCENARIOS.default.profits);
      const [selectedScenarioKey, setSelectedScenarioKey] = useState('default');

      // 재원 및 배분 수식 옵션 상태
      // allocationMode: 'weighted' (가중 인원수 57,250명 모수 완전배분 - 기본값) vs 'simple' (단순 77,500명 인원수 모수 배분)
      const [allocationMode, setAllocationMode] = useState('weighted');
      // opi2Mode: 'deduction' (방식 1: 통합 차감형) vs 'excess' (방식 2: 100조 초과 순수 분리형)
      const [opi2Mode, setOpi2Mode] = useState('deduction');

      // UI 탭 및 모달 상태
      const [myDivision, setMyDivision] = useState('memory'); // BonusCHIP 스타일 내 소속 사업부 하이라이트 ('memory', 'common', 'nonMemory')
      const [selectedDivisionTab, setSelectedDivisionTab] = useState('all'); // 'all', 'memory', 'common', 'nonMemory'
      const [showInfoModal, setShowInfoModal] = useState(false);
      const [toastMsg, setToastToast] = useState('');

      // 계약연봉 직접 입력 핸들러 (만 원 단위, 입력 중에는 자유롭게 타이핑 허용 후 범위 보정)
      const handleSalaryInputChange = (valStr) => {
        if (valStr === '') {
          setBaseSalaryManwon(5000);
          return;
        }
        const num = Number(valStr);
        if (!isNaN(num)) {
          setBaseSalaryManwon(Math.min(12000, Math.max(0, num)));
        }
      };
      const handleSalaryInputBlur = () => {
        setBaseSalaryManwon(prev => Math.min(12000, Math.max(5000, Math.round(prev))));
      };

      const showToast = (msg) => {
        setToastToast(msg);
        setTimeout(() => setToastToast(''), 3000);
      };

      // 시나리오 프리셋 변경 핸들러
      const handleSelectScenario = (key) => {
        setSelectedScenarioKey(key);
        setOpProfits({ ...SCENARIOS[key].profits });
        showToast(`'${SCENARIOS[key].name}' 프리셋이 적용되었습니다.`);
      };

      const SALARY_CAP_WON = 120000000; // 1.2억 원 (12,000만 원) 샐러리캡
      const baseSalaryWon = Math.min(SALARY_CAP_WON, baseSalaryManwon * 10000);
      const opi1CapWon = baseSalaryWon * 0.5; // 2027년 시작 기준 OPI 1 개인별 최대 한도 (연봉 50%)

      // ==========================================
      // 핵심 연산: 5개년 연도별 & 사업부별 시뮬레이션 계산
      // ==========================================
      const simulationData = useMemo(() => {
        const years = [2027, 2028, 2029, 2030, 2031];
        const divisions = [
          { key: 'memory', name: '메모리사업부', count: headcounts.memory, weight: 1.0, weightLabel: '100%', color: '#3B82F6' },
          { key: 'common', name: '공통부서', count: headcounts.common, weight: 0.7, weightLabel: '70%', color: '#10B981' },
          { key: 'nonMemory', name: '비메모리사업부', count: headcounts.nonMemory, weight: 0.4, weightLabel: '40%', color: '#F59E0B' }
        ];

        const resultsByYear = {};

        years.forEach((year, yearIdx) => {
          const perfYear = year - 1; // 실적 기준 연도 (2026 ~ 2030년 영업이익 -> 2027 ~ 2031년 수령)
          const opTrillion = opProfits[year] || 0;
          const opWon = opTrillion * 1000000000000; // 조 -> 원
          const totalPoolWon = opWon * 0.105; // 10.5% 전체 재원
          const isHurdleMet = opTrillion > 100; // OPI 2 발동 조건: 100조 초과

          // 연도별 계약연봉 계산 (매년 salaryGrowthRate% 복리 상승, 최대 1.2억 원 샐러리캡 적용)
          const rawYearSalaryWon = baseSalaryWon * Math.pow(1 + (salaryGrowthRate / 100), yearIdx);
          const yearSalaryWon = Math.min(SALARY_CAP_WON, Math.round(rawYearSalaryWon));
          const yearOpi1CapWon = yearSalaryWon * 0.5; // 해당 연도 OPI 1 최대 한도 (최대 6,000만 원)
          const isSalaryCapped = yearSalaryWon >= SALARY_CAP_WON;

          // 연도별 삼성전자 주가 계산 (매년 stockGrowthRate% 복리 변동)
          const yearStockPrice = Math.max(10000, Math.round(stockPrice * Math.pow(1 + (stockGrowthRate / 100), yearIdx)));

          // PSU (Performance Stock Unit): 총 약정 주식(CL2 400주 / CL3·4 600주)을 2028·2029·2030년 10월에 1/3씩 분할 수령
          const isPsuYear = (year === 2028 || year === 2029 || year === 2030);
          const psuOneThirdFloor = Math.floor(psuTotalShares / 3);
          const psuGrantedShares = year === 2028
            ? psuOneThirdFloor
            : year === 2029
              ? psuOneThirdFloor
              : year === 2030
                ? (psuTotalShares - psuOneThirdFloor * 2)
                : 0;
          const psuGrossValue = psuGrantedShares * yearStockPrice;

          // 1. 배분 모드에 따른 사업부별 1인당 Gross 배정액 산출 [메모리 100% : 공통 70% : 비메모리 40%]
          let grossAllocation = {};
          const weightedUsers = (headcounts.memory * 1.0) + (headcounts.common * 0.7) + (headcounts.nonMemory * 0.4);
          const totalAllUsers = headcounts.memory + headcounts.common + headcounts.nonMemory;

          const baseUnit = allocationMode === 'weighted'
            ? (weightedUsers > 0 ? totalPoolWon / weightedUsers : 0)
            : (totalAllUsers > 0 ? totalPoolWon / totalAllUsers : 0);

          grossAllocation.memory = baseUnit * 1.0;    // 100% (공통 4 + 메모리 6 = 10)
          grossAllocation.common = baseUnit * 0.7;    // 70%
          grossAllocation.nonMemory = baseUnit * 0.4; // 40% (공통 4 해당분)

          // 2. 100조 초과 순수 분리형(방식 2) 계산용 추가 배분액
          let grossExcessAllocation = { memory: 0, common: 0, nonMemory: 0 };
          if (opi2Mode === 'excess' && isHurdleMet) {
            const excessOpWon = (opTrillion - 100) * 1000000000000;
            const excessPoolWon = excessOpWon * 0.105;
            const excessBaseUnit = allocationMode === 'weighted'
              ? (weightedUsers > 0 ? excessPoolWon / weightedUsers : 0)
              : (totalAllUsers > 0 ? excessPoolWon / totalAllUsers : 0);

            grossExcessAllocation.memory = excessBaseUnit * 1.0;
            grossExcessAllocation.common = excessBaseUnit * 0.7;
            grossExcessAllocation.nonMemory = excessBaseUnit * 0.4;
          }

          // 사업부별 상세 계산
          const divResults = {};
          divisions.forEach(div => {
            const gross = grossAllocation[div.key] || 0;

            // OPI 1 (현금): 해당 연도 계약연봉의 50% Cap 적용
            const opi1Gross = Math.min(gross, yearOpi1CapWon);
            const opi1TaxInfo = calcOPI1Tax(yearSalaryWon, opi1Gross);

            // OPI 2 (주식):
            let opi2Gross = 0;
            if (isHurdleMet) {
              if (opi2Mode === 'deduction') {
                opi2Gross = Math.max(0, gross - opi1Gross);
              } else {
                opi2Gross = grossExcessAllocation[div.key] || 0;
              }
            } else {
              opi2Gross = 0; // 100조 이하 미발동
            }

            const opi2TaxInfo = calcOPI2Tax(opi2Gross);

            // 주식 수 산출 (해당 연도 주가 yearStockPrice 기준):
            // 세전 배정 주식 수
            const preTaxStockShares = yearStockPrice > 0 ? Math.floor(opi2Gross / yearStockPrice) : 0;
            // 세금(54.467%)만큼 주식 수를 차감하고 실제 계좌에 입고되는 세후 순주식 수 (45.533%)
            const netReceivedShares = yearStockPrice > 0 ? Math.floor(opi2TaxInfo.netStockValue / yearStockPrice) : 0;
            const taxDeductedShares = Math.max(0, preTaxStockShares - netReceivedShares);

            // OPI 2 매도제한 독소조항 (즉시 매도가능 1/3, 1년 후 해제 1/3, 2년 후 해제 1/3)
            const tranche1Shares = Math.floor(netReceivedShares / 3); // 당해(yr) 즉시 매도가능 1/3
            const tranche2Shares = Math.floor(netReceivedShares / 3); // 1년 후(yr+1) 매도가능 1/3
            const tranche3Shares = netReceivedShares - tranche1Shares - tranche2Shares; // 2년 후(yr+2) 매도가능 1/3
            const lockedFromThisYearShares = tranche2Shares + tranche3Shares; // 당해 수령분 중 1~2년 락업 물량(2/3)
            const immediateSellableValue = opi2TaxInfo.netStockValue * (1 / 3);
            const lockedStockValue = opi2TaxInfo.netStockValue * (2 / 3);

            // 3. PSU (28·29·30년 10월 1/3씩 분할 수령, CL2 400주 / CL3·4 600주)
            // 10월에 약정 주식은 세금 차감 없이 전량 입고되며, 해당 소득세는 '다음 해 연말정산'에서 OPI 1 현금 또는 OPI 2 주식 수 차감으로 정산됨 (2차 패스에서 반영)
            // 연봉 + OPI 1 + OPI 2 합산 과표(PSU 수령 연도 기준) 위에서 PSU 수령분 한계세액 산출
            const psuTaxInfo = psuGrossValue > 0
              ? calcOPI1Tax(yearSalaryWon + opi1Gross + opi2Gross, psuGrossValue)
              : { totalTax: 0, netCash: 0, effectiveRate: 0 };

            const psuReceivedShares = psuGrantedShares;
            const psuNetStockValue = psuGrossValue;
            const psuTaxDeductedShares = 0; // 다음 해 정산 시 OPI 2 주식 수에서 차감된 주식 수 (2차 패스에서 갱신)
            const psuCashTaxDeduction = 0; // 다음 해 정산 시 OPI 1 현금에서 차감된 금액 (2차 패스에서 갱신)

            // 통장 순현금 수령액 (주식 강제 매도 없이 순수 현금만 표시) = OPI 1 세후 현금 - (전년도 PSU 연말정산 세금 중 현금 차감분)
            const finalNetBankCash = opi1TaxInfo.netCash - psuCashTaxDeduction;

            // 계좌 총 보유 주식 (OPI 2 세후 입고 주식 100% 전량 + PSU 입고 주식)
            const totalRetainedShares = netReceivedShares + psuReceivedShares;
            const totalRetainedStockValue = opi2TaxInfo.netStockValue + psuNetStockValue;

            // 총 세후 실수령 가치 (통장 순현금 + 계좌 총 보유 주식 가치)
            const totalCombinedValue = finalNetBankCash + totalRetainedStockValue;
            const totalTaxesPaid = opi1TaxInfo.totalTax + opi2TaxInfo.totalTax + psuTaxInfo.totalTax;

            divResults[div.key] = {
              divisionName: div.name,
              perfYear,
              yearSalaryWon,
              yearOpi1CapWon,
              isSalaryCapped,
              yearStockPrice,
              grossTotal: gross,
              opi1Gross,
              opi1Tax: opi1TaxInfo.totalTax,
              opi1NetCash: opi1TaxInfo.netCash,
              opi1TaxRate: opi1TaxInfo.effectiveRate,
              opi1TaxBracket: opi1TaxInfo.taxBracket,
              opi2Gross,
              opi2Tax: opi2TaxInfo.totalTax,
              opi2NetStock: opi2TaxInfo.netStockValue,
              preTaxStockShares,
              taxDeductedShares,
              netReceivedShares,
              tranche1Shares,
              tranche2Shares,
              tranche3Shares,
              lockedFromThisYearShares,
              immediateSellableValue,
              lockedStockValue,
              unlockedInYearShares: 0, // 2차 패스에서 누적 해제 물량 합산
              unlockedInYearValue: 0,
              fromPrev1YrShares: 0,
              fromPrev2YrShares: 0,
              isPsuYear,
              psuGrantedShares,
              psuGrossValue,
              psuTax: psuTaxInfo.totalTax,
              psuReceivedShares,
              psuTaxDeductedShares,
              psuNetStockValue,
              psuCashTaxDeduction,
              finalNetBankCash,
              totalRetainedShares,
              totalRetainedStockValue,
              totalCombinedValue,
              totalTaxesPaid
            };
          });

          resultsByYear[year] = {
            year,
            perfYear,
            opTrillion,
            opWon,
            totalPoolWon,
            isHurdleMet,
            yearSalaryWon,
            yearOpi1CapWon,
            isSalaryCapped,
            yearStockPrice,
            isPsuYear,
            psuGrantedShares,
            psuGrossValue,
            divisions: divResults
          };
        });

        // 2차 패스 A: 전년도 10월 PSU 수령분의 소득세를 '다음 해 연말정산'에서 정산
        // - opi1_cash: OPI 1 현금(1월 말)에서 우선 차감, 부족분은 OPI 2 주식 수 차감
        // - opi2_stock: OPI 2 주식(3월말~4월초 입고분) 수 차감 우선, 부족분은 OPI 1 현금에서 차감
        years.forEach(yr => {
          divisions.forEach(div => {
            const cur = resultsByYear[yr].divisions[div.key];
            const prev = resultsByYear[yr - 1] ? resultsByYear[yr - 1].divisions[div.key] : null;
            const settleTax = prev ? prev.psuTax : 0;
            const price = cur.yearStockPrice;
            const availShares = cur.netReceivedShares;
            let settleCash = 0;
            let settleShares = 0;

            if (settleTax > 0) {
              if (psuTaxMode === 'opi1_cash') {
                settleCash = Math.min(settleTax, cur.opi1NetCash);
                const rem = settleTax - settleCash;
                settleShares = price > 0 ? Math.min(availShares, Math.ceil(rem / price)) : 0;
                settleCash += Math.max(0, rem - settleShares * price);
              } else {
                const wantShares = price > 0 ? Math.ceil(settleTax / price) : 0;
                settleShares = Math.min(availShares, wantShares);
                settleCash = Math.max(0, settleTax - settleShares * price);
              }
            }

            cur.psuSettleTax = settleTax;
            cur.psuSettleFromYear = settleTax > 0 ? yr - 1 : null;
            cur.psuCashTaxDeduction = settleCash;
            cur.psuTaxDeductedShares = settleShares;
            cur.opi2SharesBeforePsuSettle = availShares;
            cur.netReceivedShares = availShares - settleShares;

            // OPI 2 독소조항 분할 재계산 (PSU 세금 정산 후 실제 남은 주식 기준)
            cur.tranche1Shares = Math.floor(cur.netReceivedShares / 3);
            cur.tranche2Shares = Math.floor(cur.netReceivedShares / 3);
            cur.tranche3Shares = cur.netReceivedShares - cur.tranche1Shares - cur.tranche2Shares;
            cur.lockedFromThisYearShares = cur.tranche2Shares + cur.tranche3Shares;
            cur.immediateSellableValue = cur.tranche1Shares * price;
            cur.lockedStockValue = cur.lockedFromThisYearShares * price;

            cur.finalNetBankCash = cur.opi1NetCash - settleCash;
            cur.totalRetainedShares = cur.netReceivedShares + cur.psuReceivedShares;
            cur.totalRetainedStockValue = Math.max(0, cur.opi2NetStock - settleShares * price) + cur.psuNetStockValue;
            cur.totalCombinedValue = cur.finalNetBankCash + cur.totalRetainedStockValue;
          });
        });

        // 2차 패스 B: 연도별로 실제 매도 가능하게 풀리는(Unlock) OPI 2 주식 수 계산
        // yr년 매도가능 해제 물량 = 당해(yr) 수령분 즉시 1/3 + 전년도(yr-1) 수령분 1년후 해제 1/3 + 2년전(yr-2) 수령분 2년후 해제 1/3
        years.forEach(yr => {
          divisions.forEach(div => {
            const cur = resultsByYear[yr].divisions[div.key];
            const prev1 = resultsByYear[yr - 1] ? resultsByYear[yr - 1].divisions[div.key].tranche2Shares : 0;
            const prev2 = resultsByYear[yr - 2] ? resultsByYear[yr - 2].divisions[div.key].tranche3Shares : 0;
            const unlockedShares = cur.tranche1Shares + prev1 + prev2;
            cur.fromPrev1YrShares = prev1;
            cur.fromPrev2YrShares = prev2;
            cur.unlockedInYearShares = unlockedShares;
            cur.unlockedInYearValue = unlockedShares * cur.yearStockPrice;
          });
        });

        const final2031StockPrice = resultsByYear[2031].yearStockPrice;

        // 5개년 누적 합계 (Cumulative Totals)
        const cumulativeByDivision = {};
        divisions.forEach(div => {
          let sumGrossTotal = 0;
          let sumOpi1Gross = 0;
          let sumOpi1Tax = 0;
          let sumOpi1Net = 0;
          let sumOpi2Gross = 0;
          let sumOpi2Tax = 0;
          let sumOpi2Net = 0;
          let sumFinalNetCash = 0; // 순수 현금 합계 (OPI 1 세후 - PSU 연말정산 세금)
          let sumRetainedStock = 0; // OPI 2 세후주식(100%) + PSU 입고 주식 합산 원금
          let sumPsuGross = 0;
          let sumPsuTax = 0;
          let sumPsuCashTax = 0;
          let sumPsuStockTaxShares = 0;
          let sumPsuReceivedShares = 0;
          let sumPsuStockValue = 0;
          let sumTotalTaxes = 0;
          let sumPreTaxShares = 0;
          let sumTaxDeductedShares = 0;
          let sumNetReceivedShares = 0; // OPI 2 5개년 입고 총 주식수 (100%)
          let sumUnlockedOpi2Shares = 0; // 2031년 말 기준 락업 해제 완료된 OPI 2 주식수 (매도가능)
          let sumUnlockedOpi2Value = 0;
          let sumRetainedShares = 0; // OPI 2 (100%) + PSU 합산 총 보유 주식수

          years.forEach(yr => {
            const data = resultsByYear[yr].divisions[div.key];
            sumGrossTotal += data.grossTotal + data.psuGrossValue;
            sumOpi1Gross += data.opi1Gross;
            sumOpi1Tax += data.opi1Tax;
            sumOpi1Net += data.opi1NetCash;
            sumOpi2Gross += data.opi2Gross;
            sumOpi2Tax += data.opi2Tax;
            sumOpi2Net += data.opi2NetStock;
            sumFinalNetCash += data.finalNetBankCash;
            sumPsuGross += data.psuGrossValue;
            sumPsuTax += data.psuTax;
            sumPsuCashTax += data.psuCashTaxDeduction;
            sumPsuStockTaxShares += data.psuTaxDeductedShares;
            sumPsuReceivedShares += data.psuReceivedShares;
            sumPsuStockValue += data.psuNetStockValue;
            sumRetainedStock += data.totalRetainedStockValue;
            sumTotalTaxes += data.totalTaxesPaid;
            sumPreTaxShares += data.preTaxStockShares;
            sumTaxDeductedShares += data.taxDeductedShares;
            sumNetReceivedShares += data.netReceivedShares;
            sumUnlockedOpi2Shares += data.unlockedInYearShares;
            sumUnlockedOpi2Value += data.unlockedInYearValue;
            sumRetainedShares += data.totalRetainedShares;
          });

          // 2031년 말 시점에도 독소조항(1년·2년 매도제한)에 묶여 있는 잔여 락업 주식 수 (30년 수령분의 1/3 + 31년 수령분의 2/3)
          const sumStillLockedOpi2Shares = Math.max(0, sumNetReceivedShares - sumUnlockedOpi2Shares);
          const sumStillLockedOpi2Value = sumStillLockedOpi2Shares * final2031StockPrice;

          // 2031년 말 기준 누적 보유 주식(OPI 2 100% + PSU)의 평가가치 및 평가차익 계산
          const finalRetainedStockEval = stockGrowthRate !== 0
            ? sumRetainedShares * final2031StockPrice
            : sumRetainedStock;
          const retainedStockGain = finalRetainedStockEval - sumRetainedStock;

          cumulativeByDivision[div.key] = {
            divisionName: div.name,
            headcount: div.count,
            weightLabel: div.weightLabel,
            color: div.color,
            sumGrossTotal,
            sumOpi1Gross,
            sumOpi1Tax,
            sumOpi1Net,
            sumOpi2Gross,
            sumOpi2Tax,
            sumOpi2Net,
            sumFinalNetCash,
            sumPsuGross,
            sumPsuTax,
            sumPsuCashTax,
            sumPsuStockTaxShares,
            sumPsuReceivedShares,
            sumPsuStockValue,
            sumRetainedStock,
            finalRetainedStockEval,
            retainedStockGain,
            sumTotalTaxes,
            sumPreTaxShares,
            sumTaxDeductedShares,
            sumNetReceivedShares,
            sumUnlockedOpi2Shares,
            sumUnlockedOpi2Value,
            sumStillLockedOpi2Shares,
            sumStillLockedOpi2Value,
            sumRetainedShares,
            totalCombined: sumFinalNetCash + finalRetainedStockEval
          };
        });

        return {
          years,
          divisions,
          resultsByYear,
          final2031StockPrice,
          cumulativeByDivision
        };
      }, [headcounts, baseSalaryWon, salaryGrowthRate, stockPrice, stockGrowthRate, psuTotalShares, psuTaxMode, opProfits, allocationMode, opi2Mode, opi1CapWon]);

      // CSV 데이터 다운로드 핸들러
      const handleExportCSV = () => {
        let csv = '\uFEFF'; // Excel UTF-8 BOM
        csv += '실적연도,수령연도,영업이익(조원),적용계약연봉(원),OPI1_한도Cap(원),사업부,OPI총배정액(원),OPI1_세전(원),OPI1_세금(원),OPI1_세후현금(원),OPI2_세전주식(원),OPI2_세금차감액(54.467%)(원),OPI2_세후입고주식가치(45.533%)(원),세전배정주식수(주),세금차감주식수(주),OPI2_실제입고주식수(주),당해즉시매도가능(1/3)(주),1년후해제독소조항(1/3)(주),2년후해제독소조항(1/3)(주),당해연도총해제매도가능주식수(주),PSU_약정수령주식수(주),PSU_세전가치(원),PSU_입고주식수(주),PSU_연말정산현금세금차감(원),통장순현금수령액(원),계좌총보유주식가치(원),계좌총보유주식수(주)\n';

        simulationData.years.forEach(yr => {
          const yrData = simulationData.resultsByYear[yr];
          simulationData.divisions.forEach(div => {
            const d = yrData.divisions[div.key];
            csv += [
              d.perfYear,
              yr,
              yrData.opTrillion,
              Math.round(yrData.yearSalaryWon),
              Math.round(yrData.yearOpi1CapWon),
              d.divisionName,
              Math.round(d.grossTotal),
              Math.round(d.opi1Gross),
              Math.round(d.opi1Tax),
              Math.round(d.opi1NetCash),
              Math.round(d.opi2Gross),
              Math.round(d.opi2Tax),
              Math.round(d.opi2NetStock),
              d.preTaxStockShares,
              d.taxDeductedShares,
              d.netReceivedShares,
              d.tranche1Shares,
              d.tranche2Shares,
              d.tranche3Shares,
              d.unlockedInYearShares,
              d.psuGrantedShares,
              Math.round(d.psuGrossValue),
              d.psuReceivedShares,
              Math.round(d.psuCashTaxDeduction),
              Math.round(d.finalNetBankCash),
              Math.round(d.totalRetainedStockValue),
              d.totalRetainedShares
            ].join(',') + '\n';
          });
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `삼성전자_성과급_5개년_시뮬레이션_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('CSV 파일이 성공적으로 다운로드되었습니다.');
      };

      // 요약 복사 기능
      const handleCopySummary = () => {
        const memCum = simulationData.cumulativeByDivision.memory;
        const comCum = simulationData.cumulativeByDivision.common;
        const nonCum = simulationData.cumulativeByDivision.nonMemory;

        const text = `[삼성전자 2027~2031년 수령 (2026~2030년 영업이익 재원) 성과급 5개년 시뮬레이션 요약]
- 지급 일정: OPI 1(현금) 매년 1월 말 지급 / OPI 2(주식) 매년 주주총회 결의 후 3월 말~4월 초 지급 / PSU 28·29·30년 10월 1/3씩 지급
- 적용 시나리오: ${SCENARIOS[selectedScenarioKey]?.name} (26년실적→27년수령 ${opProfits[2027]}조, 27년→28년 ${opProfits[2028]}조, 28년→29년 ${opProfits[2029]}조, 29년→30년 ${opProfits[2030]}조, 30년→31년 ${opProfits[2031]}조)
- 2027년 시작 연봉: ${formatKoreanWon(baseSalaryWon)} (연 ${salaryGrowthRate}% 상승, 1.2억 원 샐러리캡 적용 → 2031년 ${formatKoreanWon(simulationData.resultsByYear[2031].yearSalaryWon)})
- 삼성전자 주가: ${formatNumber(stockPrice)}원 (연 주가상승률 ${stockGrowthRate}%)
- PSU 총 약정 주식: 총 ${psuTotalShares}주 (28·29·30년 10월 1/3씩 분할 수령, 10월 수령 시 세금 없음, 다음 해 연말정산에서 ${psuTaxMode === 'opi1_cash' ? 'OPI 1 현금 우선 차감(부족분 OPI 2 주식수 차감)' : 'OPI 2 주식수 우선 차감(부족분 OPI 1 현금 차감)'})

[1. 메모리사업부 (인원: ${formatNumber(headcounts.memory)}명)]
• 5개년 세후 총 수령 가치: ${formatKoreanWon(memCum.totalCombined)}
• 통장 순현금 수령 총액 (OPI 1 세후 - PSU 연말정산 세금): ${formatKoreanWon(memCum.sumFinalNetCash)} (OPI 1 세후 원금 ${formatKoreanWon(memCum.sumOpi1Net)})
• OPI 2 세후 입고 주식 총액 (주총 후 3월말~4월초 지급): ${formatKoreanWon(memCum.sumOpi2Net)} (입고 ${formatNumber(memCum.sumNetReceivedShares)}주 / 세금차감 ${formatNumber(memCum.sumTaxDeductedShares)}주)
  ↳ [독소조항 락업 현황(31년말 기준)] 매도가능(락업해제): ${formatNumber(memCum.sumUnlockedOpi2Shares)}주 / 2032~33년 매도제한 묶인 주식: ${formatNumber(memCum.sumStillLockedOpi2Shares)}주
• PSU 약정 주식 (28~30년 10월 1/3씩): +${formatNumber(memCum.sumPsuReceivedShares)}주 입고 (다음 해 연말정산: 현금 -${formatKoreanWon(memCum.sumPsuCashTax)} / OPI 2 주식 -${formatNumber(memCum.sumPsuStockTaxShares)}주)
• 계좌 총 보유 주식 (OPI 2 100% + PSU): ${formatKoreanWon(memCum.finalRetainedStockEval)} (총 ${formatNumber(memCum.sumRetainedShares)}주 보유)

[2. 공통부서 (인원: ${formatNumber(headcounts.common)}명)]
• 5개년 세후 총 수령 가치: ${formatKoreanWon(comCum.totalCombined)}
• 통장 순현금: ${formatKoreanWon(comCum.sumFinalNetCash)} / 총 보유주식: ${formatKoreanWon(comCum.finalRetainedStockEval)} (${formatNumber(comCum.sumRetainedShares)}주)

[3. 비메모리사업부 (인원: ${formatNumber(headcounts.nonMemory)}명)]
• 5개년 세후 총 수령 가치: ${formatKoreanWon(nonCum.totalCombined)}
• 통장 순현금: ${formatKoreanWon(nonCum.sumFinalNetCash)} / 총 보유주식: ${formatKoreanWon(nonCum.finalRetainedStockEval)} (${formatNumber(nonCum.sumRetainedShares)}주)
`;

        navigator.clipboard.writeText(text).then(() => {
          showToast('5개년 요약 텍스트가 클립보드에 복사되었습니다.');
        });
      };

      const myCumData = simulationData.cumulativeByDivision[myDivision] || simulationData.cumulativeByDivision.memory;

      return (
        <div className="min-h-screen flex flex-col text-slate-100">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-samsung text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-blue-400 animate-bounce">
              <span className="text-xl">✨</span>
              <span className="font-semibold text-sm">{toastMsg}</span>
            </div>
          )}

          {/* Institutional Info Modal */}
          {showInfoModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm">
              <div className="bg-navy-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center pb-4 border-b border-slate-700">
                  <h3 className="text-xl font-bold text-white flex items-center gap-2">
                    <span className="p-1.5 bg-samsung rounded-lg text-white text-sm">삼성전자</span>
                    2026년 5월 성과급 제도 개편안 & 지급 일정 안내
                  </h3>
                  <button 
                    onClick={() => setShowInfoModal(false)}
                    className="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-navy-700"
                  >
                    ✕
                  </button>
                </div>
                
                <div className="mt-4 space-y-4 text-sm text-slate-300 leading-relaxed">
                  <div className="p-4 bg-navy-900/60 rounded-xl border border-slate-700">
                    <h4 className="font-bold text-blue-400 text-base mb-1">핵심 골자: OPI 1 + OPI 2 구조 및 지급 시점</h4>
                    <p>
                      기존 EVA 기준에서 탈피하여 <strong>연간 영업이익의 10.5%</strong>를 전체 성과급 재원으로 설정합니다.
                      1인당 배정 비율은 <strong>[메모리 100% : 공통 70% : 비메모리 40%]</strong>로 차등 배분됩니다.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div className="p-3 bg-navy-900/40 rounded-xl border border-slate-700">
                      <span className="font-bold text-emerald-400 block mb-1">💵 OPI 1 (1월 말 현금 지급)</span>
                      <p className="text-xs text-slate-400">
                        영업이익 규모와 관계없이 1인당 배정액 중 <strong>계약연봉(최대 1.2억 Cap)의 50%</strong>까지 이듬해 <strong>1월 말</strong> 현금으로 지급됩니다.
                        근로소득 종합과세 과표구간에 따른 누진세율이 원천징수되어 현금 입금됩니다.
                      </p>
                    </div>
                    <div className="p-3 bg-navy-900/40 rounded-xl border border-slate-700">
                      <span className="font-bold text-amber-400 block mb-1">📈 OPI 2 (주총 후 3월 말~4월 초 주식 지급)</span>
                      <p className="text-xs text-slate-400">
                        <strong>영업이익 100조 원 초과 달성 시에만 발동</strong>되며, 정기 <strong>주주총회 결의 후 3월 말~4월 초</strong>에 자사주로 지급됩니다.
                        세금(<strong>54.467%</strong>)만큼 주식 수를 줄여서 선공제하고 <strong>세후 순주식(45.533%)</strong>으로 계좌에 입고됩니다.
                      </p>
                    </div>
                  </div>

                  <div className="p-4 bg-blue-950/40 border border-blue-800/60 rounded-xl text-xs space-y-1.5">
                    <h5 className="font-bold text-blue-300 text-sm">🔒 OPI 2 매도제한 독소조항 (즉시 1/3 · 1년후 1/3 · 2년후 1/3) & PSU 분할 수령</h5>
                    <p className="text-blue-100/90">
                      • <strong>OPI 2 매도제한(독소조항):</strong> 3월 말~4월 초 입고된 세후 순주식(45.533%)은 <strong>입고 즉시 1/3만 매도 가능</strong>하며, 나머지 <strong>1/3은 1년 후(이듬해 3~4월)</strong>, 마지막 <strong>1/3은 2년 후(2년 뒤 3~4월)</strong>에 매도 제한이 풀립니다.
                    </p>
                    <p className="text-purple-200/90">
                      • <strong>PSU 약정 주식:</strong> 직급별 총 약정 주식(<strong>CL2 총 400주 / CL3·CL4 총 600주</strong>)을 <strong>2028년 10월, 2029년 10월, 2030년 10월에 1/3씩 분할 수령</strong>하며, 10월 수령 시에는 세금 차감 없이 전량 입고되고 <strong>다음 해 연말정산</strong> 때 OPI 1(현금) 또는 OPI 2(주식 수) 정산에서 세금이 차감됩니다.
                    </p>
                  </div>
                </div>

                <div className="mt-6 flex justify-end">
                  <button 
                    onClick={() => setShowInfoModal(false)}
                    className="px-5 py-2.5 bg-samsung hover:bg-samsung-light text-white font-semibold text-sm rounded-xl transition"
                  >
                    확인 및 닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Top Global Navigation Bar (BonusCHIP Inspired Sleek Header) */}
          <header className="bg-navy-950/85 backdrop-blur-md border-b border-slate-800/90 sticky top-0 z-40 px-4 lg:px-8 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              
              {/* Brand Title */}
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-samsung via-blue-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-900/40 font-black text-white text-base">
                  DS
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base sm:text-lg font-extrabold text-white tracking-tight">
                      삼성전자 보상 시뮬레이터 <span className="text-blue-400 font-black">PRO</span>
                    </h1>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/40">
                      2027 ~ 2031 수령
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    1월 말 OPI 1(현금) · 3월 말~4월 초 주총 후 OPI 2(주식·독소조항) · 10월 PSU(1/3 분할) 정밀 계산기
                  </p>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center flex-wrap gap-2 text-xs font-medium">
                <button
                  onClick={() => setShowInfoModal(true)}
                  className="px-3 py-2 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition flex items-center gap-1.5"
                >
                  <span>📘</span> 제도·일정 안내
                </button>
                <button
                  onClick={handleCopySummary}
                  className="px-3 py-2 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition flex items-center gap-1.5"
                >
                  <span>📋</span> 결과 요약 복사
                </button>
                <button
                  onClick={handleExportCSV}
                  className="px-3.5 py-2 bg-gradient-to-r from-samsung to-blue-600 hover:from-blue-700 hover:to-blue-500 text-white font-semibold rounded-xl shadow-md shadow-blue-950/50 transition flex items-center gap-1.5"
                >
                  <span>📊</span> CSV 다운로드
                </button>
              </div>

            </div>
          </header>

          {/* Main Layout Container */}
          <main className="max-w-7xl mx-auto w-full px-4 lg:px-8 py-6 space-y-6 flex-1">

            {/* ===================================================================== */}
            {/* [BonusCHIP 스타일] 0. 내 프로필 & 계약연봉 직접 입력 퀵 바 + 연간 지급 타임라인 */}
            {/* ===================================================================== */}
            <section className="fintech-card rounded-2xl p-5 space-y-4">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
                
                {/* 좌측: 내 소속 사업부 · 직급(PSU) · 계약연봉 직접 입력 */}
                <div className="lg:col-span-8 space-y-3.5">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <span className="px-2 py-0.5 rounded-md bg-blue-500/20 border border-blue-400/40 text-blue-300 text-[11px] font-bold">
                        MY PROFILE
                      </span>
                      <h2 className="text-sm sm:text-base font-bold text-white">
                        내 소속 사업부 · 계약연봉 직접 입력 · 직급(PSU) 빠른 설정
                      </h2>
                    </div>
                    <span className="text-[11px] text-slate-400">
                      연봉 5,000만 ~ 12,000만 원(1.2억 샐러리캡) 직접 입력 가능
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    {/* 1) 내 사업부 선택 */}
                    <div className="fintech-subcard rounded-xl p-3 space-y-2">
                      <div className="flex justify-between items-center text-[11px] text-slate-400">
                        <span className="font-semibold text-slate-300">① 내 소속 사업부</span>
                        <span className="text-blue-400 font-bold">100 : 70 : 40</span>
                      </div>
                      <div className="grid grid-cols-3 gap-1">
                        {[
                          { key: 'memory', label: '메모리', sub: '100%' },
                          { key: 'common', label: '공통', sub: '70%' },
                          { key: 'nonMemory', label: '비메모리', sub: '40%' }
                        ].map(d => (
                          <button
                            key={d.key}
                            onClick={() => setMyDivision(d.key)}
                            className={`py-1.5 px-1 rounded-lg border text-center transition ${
                              myDivision === d.key
                                ? 'bg-blue-600/90 border-blue-400 text-white font-bold shadow'
                                : 'bg-navy-950/70 border-slate-800 text-slate-400 hover:text-white'
                            }`}
                          >
                            <span className="text-xs block">{d.label}</span>
                            <span className="text-[9px] opacity-80 block">{d.sub}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* 2) 나의 2027 시작 계약연봉 직접 입력 */}
                    <div className="fintech-subcard rounded-xl p-3 space-y-2">
                      <div className="flex justify-between items-center text-[11px]">
                        <span className="font-semibold text-slate-300">② 계약연봉 직접 입력</span>
                        <span className="text-emerald-400 font-bold">OPI1 Cap {formatKoreanWon(opi1CapWon)}</span>
                      </div>
                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => setBaseSalaryManwon(prev => Math.max(5000, prev - 100))}
                          className="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700"
                          title="-100만 원"
                        >
                          -100
                        </button>
                        <div className="relative flex-1">
                          <input
                            type="number"
                            min="5000"
                            max="12000"
                            step="10"
                            value={baseSalaryManwon}
                            onChange={(e) => handleSalaryInputChange(e.target.value)}
                            onBlur={handleSalaryInputBlur}
                            className="w-full bg-navy-950 border border-blue-500/60 focus:border-blue-400 rounded-lg pl-2.5 pr-10 py-1.5 text-right font-extrabold text-white text-sm focus:outline-none"
                          />
                          <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] text-slate-400 font-semibold">
                            만원
                          </span>
                        </div>
                        <button
                          onClick={() => setBaseSalaryManwon(prev => Math.min(12000, prev + 100))}
                          className="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700"
                          title="+100만 원"
                        >
                          +100
                        </button>
                      </div>
                      <div className="flex justify-between gap-1">
                        {[7000, 8500, 10000, 12000].map(preset => (
                          <button
                            key={preset}
                            onClick={() => setBaseSalaryManwon(preset)}
                            className={`flex-1 py-0.5 rounded text-[10px] font-semibold border transition ${
                              baseSalaryManwon === preset
                                ? 'bg-blue-600/40 border-blue-400 text-blue-200'
                                : 'bg-navy-950/60 border-slate-800 text-slate-400 hover:text-white'
                            }`}
                          >
                            {preset === 10000 ? '1억' : preset === 12000 ? '1.2억Cap' : `${preset / 1000}천`}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* 3) 직급별 PSU 약정 & 기준주가 */}
                    <div className="fintech-subcard rounded-xl p-3 space-y-2">
                      <div className="flex justify-between items-center text-[11px]">
                        <span className="font-semibold text-slate-300">③ 직급별 PSU (1/3×3년)</span>
                        <span className="text-purple-300 font-bold">총 {psuTotalShares}주</span>
                      </div>
                      <div className="grid grid-cols-3 gap-1">
                        {[
                          { label: 'CL2', sub: '총 400주', val: 400 },
                          { label: 'CL3·4', sub: '총 600주', val: 600 },
                          { label: '미적용', sub: '0주', val: 0 }
                        ].map(p => (
                          <button
                            key={p.val}
                            onClick={() => setPsuTotalShares(p.val)}
                            className={`py-1.5 px-1 rounded-lg border text-center transition ${
                              psuTotalShares === p.val
                                ? 'bg-purple-600/90 border-purple-400 text-white font-bold shadow'
                                : 'bg-navy-950/70 border-slate-800 text-slate-400 hover:text-white'
                            }`}
                          >
                            <span className="text-xs block">{p.label}</span>
                            <span className="text-[9px] opacity-80 block">{p.sub}</span>
                          </button>
                        ))}
                      </div>
                      <div className="flex items-center justify-between text-[10px] text-slate-400 pt-0.5">
                        <span>연봉상승률: <strong className="text-emerald-400">+{salaryGrowthRate}%/년</strong></span>
                        <span>기준주가: <strong className="text-amber-300">{(stockPrice / 10000).toFixed(1)}만 원</strong></span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 우측: 선택된 내 사업부 5개년 핵심 요약 히어로 박스 (BonusCHIP 스타일) */}
                <div className="lg:col-span-4 bg-gradient-to-br from-blue-950/80 via-navy-800 to-navy-900 border border-blue-500/50 rounded-2xl p-4 shadow-xl">
                  <div className="flex justify-between items-center mb-1.5">
                    <span className="text-xs font-bold text-blue-300 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                      {myCumData.divisionName} 5개년 세후 총 수령가치
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-200 border border-blue-400/30 font-semibold">
                      가중치 {myCumData.weightLabel}
                    </span>
                  </div>
                  <div className="text-2xl sm:text-3xl font-black text-white tracking-tight">
                    {formatKoreanWon(myCumData.totalCombined)}
                  </div>
                  <div className="text-[11px] text-slate-400 mt-0.5">
                    세전 총 배정액 {formatKoreanWon(myCumData.sumGrossTotal)} (공제 세금 -{formatKoreanWon(myCumData.sumTotalTaxes)})
                  </div>
                  <div className="grid grid-cols-2 gap-2 mt-3 pt-2.5 border-t border-slate-700/70 text-xs">
                    <div>
                      <span className="text-[10px] text-slate-400 block">💵 통장 순현금 (1월 말)</span>
                      <span className="font-extrabold text-emerald-400">{formatKoreanWon(myCumData.sumFinalNetCash)}</span>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400 block">📈 총 보유주식 (OPI2+PSU)</span>
                      <span className="font-extrabold text-amber-300">{formatNumber(myCumData.sumRetainedShares)}주 ({formatKoreanWon(myCumData.finalRetainedStockEval)})</span>
                    </div>
                  </div>
                </div>

              </div>

              {/* 연간 보상 지급 시기 타임라인 바 (1월 말 OPI 1 -> 3월 말~4월 초 주총 후 OPI 2 -> 10월 PSU -> 연말정산) */}
              <div className="pt-3 border-t border-slate-800/80">
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs">
                  <div className="flex items-center gap-2.5 bg-emerald-950/25 border border-emerald-800/50 rounded-xl px-3 py-2">
                    <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-extrabold text-[11px] whitespace-nowrap">1월 말</span>
                    <div>
                      <span className="font-bold text-emerald-200 block text-[11px]">OPI 1 현금 지급</span>
                      <span className="text-[10px] text-slate-400">계약연봉 최대 50% (누진세 원천징수)</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-2.5 bg-amber-950/25 border border-amber-700/50 rounded-xl px-3 py-2">
                    <span className="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-extrabold text-[11px] whitespace-nowrap">3월말~4월초</span>
                    <div>
                      <span className="font-bold text-amber-200 block text-[11px]">주총 후 OPI 2 주식 입고</span>
                      <span className="text-[10px] text-slate-400">세후 45.533% 입고 (즉시 1/3 매도가능)</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-2.5 bg-teal-950/25 border border-teal-700/50 rounded-xl px-3 py-2">
                    <span className="px-2 py-0.5 rounded bg-teal-500/20 text-teal-300 font-extrabold text-[11px] whitespace-nowrap">1년·2년후 봄</span>
                    <div>
                      <span className="font-bold text-teal-200 block text-[11px]">OPI 2 독소조항 락업 해제</span>
                      <span className="text-[10px] text-slate-400">1년후 1/3 · 2년후 1/3 순차 매도가능</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-2.5 bg-purple-950/25 border border-purple-700/50 rounded-xl px-3 py-2">
                    <span className="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-extrabold text-[11px] whitespace-nowrap">10월 (28~30년)</span>
                    <div>
                      <span className="font-bold text-purple-200 block text-[11px]">PSU 약정주식 1/3 분할입고</span>
                      <span className="text-[10px] text-slate-400">CL2 400주 / CL3·4 600주 (세금은 다음 해 연말정산)</span>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ===================================================================== */}
            {/* [최상단 배치] 1. 2026~2030년(5개년) 영업이익 조절 -> 2027~2031년 수령 */}
            {/* ===================================================================== */}
            <section className="fintech-card rounded-2xl p-5 space-y-4">
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 pb-3 border-b border-slate-700/80">
                <div>
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="px-2 py-0.5 bg-samsung text-white text-[11px] font-bold rounded">STEP 1</span>
                    <h2 className="font-bold text-white text-base sm:text-lg flex items-center gap-1.5">
                      <span>📊</span> 2026~2030년 영업이익 조절 (→ 2027~2031년 수령, 단위: 조 원)
                    </h2>
                    <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-amber-500/20 border border-amber-500/50 text-amber-300 font-semibold">
                      📌 26년 실적(370조) → 27년 1월 말 OPI 1(현금) · 3월 말~4월 초 주총 후 OPI 2(주식) 수령!
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 mt-1">
                    전년도 영업이익(2026~2030년)을 재원으로 이듬해 1월 말 OPI 1(현금), 주주총회 후 3월 말~4월 초 OPI 2(주식)를 수령합니다. 28·29·30년 10월에는 PSU가 1/3씩 지급됩니다.
                  </p>
                </div>

                {/* Quick Scenario Presets */}
                <div className="flex flex-wrap items-center gap-1.5">
                  {Object.keys(SCENARIOS).map(key => {
                    const sc = SCENARIOS[key];
                    const isSelected = selectedScenarioKey === key;
                    return (
                      <button
                        key={key}
                        onClick={() => handleSelectScenario(key)}
                        className={`px-3 py-1.5 rounded-xl border text-xs font-semibold transition ${
                          isSelected
                            ? 'bg-samsung border-blue-400 text-white shadow-md'
                            : 'bg-navy-900/70 border-slate-700 text-slate-300 hover:bg-navy-700 hover:text-white'
                        }`}
                      >
                        {sc.name}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Selected Scenario Description Banner */}

                            <span className="font-bold text-purple-300 whitespace-nowrap ml-2">
                              +{formatNumber(cum.sumPsuReceivedShares)}주 ({formatKoreanWon(cum.sumPsuStockValue)})
                            </span>
                          </div>
                        )}

                        {/* Highlight: Final Bank Cash (순수 현금) */}

                          <div className="text-right">
                            <span className="text-sm font-black">
                              {formatKoreanWon(cum.sumFinalNetCash)}
                            </span>
                          </div>
                        </div>

                          <div>
                            <span className="font-bold block text-xs">
                              계좌 총 보유 주식 가치 {stockGrowthRate !== 0 && `(31년 주가 ${formatNumber(simulationData.final2031StockPrice)}원 평가)`}

                  </div>
                </div>

                <div className="space-y-4 pt-2">
                  {simulationData.divisions.map(div => {
                    const cum = simulationData.cumulativeByDivision[div.key];
                    const unlockedPlusPsuVal = cum.sumUnlockedOpi2Value + cum.sumPsuStockValue;
                    const lockedVal = cum.sumStillLockedOpi2Value;
                    const totalVal = Math.max(1, cum.sumFinalNetCash + unlockedPlusPsuVal + lockedVal);
                    const cashRatio = Math.max(0, (cum.sumFinalNetCash / totalVal) * 100);
                    const unlockedRatio = Math.max(0, (unlockedPlusPsuVal / totalVal) * 100);
                    const lockedRatio = Math.max(0, (lockedVal / totalVal) * 100);
                    
                    return (
                      <div key={div.key} className="space-y-1.5">
                        <div className="flex justify-between items-center text-xs">
                          <span className="font-bold text-slate-200">{cum.divisionName}</span>
                          <span className="font-black text-blue-400">{formatKoreanWon(cum.totalCombined)}</span>
                        </div>

                        {/* Progress Bar */}
                        <div className="w-full bg-navy-900 rounded-full h-5 overflow-hidden flex border border-slate-700/60 p-0.5">
                          <div
                            style={{ width: `${Math.max(4, cashRatio)}%` }}
                            className="bg-emerald-500 rounded-l-full h-full flex items-center justify-center text-[10px] font-bold text-slate-900 transition-all duration-300"
                            title={`통장 순현금: ${formatKoreanWon(cum.sumFinalNetCash)}`}
                          >
                            현금 {Math.round(cashRatio)}%
                          </div>
                          <div
                            style={{ width: `${Math.max(4, unlockedRatio)}%` }}

                            title={`락업해제(매도가능)+PSU: ${formatKoreanWon(unlockedPlusPsuVal)}`}

                            해제주식 {Math.round(unlockedRatio)}%
                          </div>
                          <div
                            style={{ width: `${Math.max(4, lockedRatio)}%` }}
                            className="bg-amber-600 rounded-r-full h-full flex items-center justify-center text-[10px] font-bold text-white transition-all duration-300"
                            title={`독소조항 락업(32~33년 해제): ${formatKoreanWon(lockedVal)}`}

                          <span>순현금: {formatKoreanWon(cum.sumFinalNetCash)}</span>
                          <span className="text-teal-300">해제+PSU: {formatNumber(cum.sumUnlockedOpi2Shares + cum.sumPsuReceivedShares)}주</span>
                          <span className="text-amber-300">독소조항 묶임: {formatNumber(cum.sumStillLockedOpi2Shares)}주</span>

                      <span>📊</span> 연도별 배정액 및 독소조항 락업 분해 (메모리사업부 기준)

                    <p className="text-[11px] text-slate-400">

                    </p>
                  </div>
                </div>

                <div className="h-64 flex items-end justify-between gap-3 pt-6 pb-2 px-2 border-b border-slate-700">
                  {(() => {
                    const maxGross = Math.max(
                      350000000,
                      ...simulationData.years.map(y => {
                        const m = simulationData.resultsByYear[y].divisions.memory;
                        return m.opi1NetCash + m.immediateSellableValue + m.lockedStockValue + m.psuNetStockValue + m.totalTaxesPaid;
                      })
                    );
                    return simulationData.years.map(yr => {
                      const data = simulationData.resultsByYear[yr].divisions.memory;
                      const maxChartWon = maxGross * 1.05;
                      const opi1Height = Math.min(100, (data.opi1NetCash / maxChartWon) * 100);
                      const immHeight = Math.min(100, (data.immediateSellableValue / maxChartWon) * 100);
                      const lockHeight = Math.min(100, ((data.lockedStockValue + data.psuNetStockValue) / maxChartWon) * 100);
                      const taxHeight = Math.min(100, (data.totalTaxesPaid / maxChartWon) * 100);

                      return (
                        <div key={yr} className="flex-1 flex flex-col items-center h-full justify-end group">
                          
                          <div className="text-[10px] font-bold text-blue-300 opacity-90 mb-1 group-hover:scale-110 transition text-center">

                            <div
                              style={{ height: `${opi1Height}%` }}
                              className="bg-emerald-500 w-full"
                              title={`OPI 1 세후현금: ${formatKoreanWon(data.opi1NetCash)}`}
                            ></div>
                            <div
                              style={{ height: `${immHeight}%` }}
                              className="bg-teal-400 w-full"
                              title={`당해 즉시 매도가능(1/3): ${formatKoreanWon(data.immediateSellableValue)} (${formatNumber(data.tranche1Shares)}주)`}
                            ></div>
                            <div
                              style={{ height: `${lockHeight}%` }}
                              className="bg-amber-500 w-full"
                              title={`1~2년 독소조항 락업(2/3)+PSU: ${formatKoreanWon(data.lockedStockValue + data.psuNetStockValue)}`}

                      selectedDivisionTab === 'nonMemory'
                        ? 'bg-amber-600 text-white shadow'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    비메모리사업부 (40%)
                  </button>
                </div>
              </div>

              {/* Table Responsive Wrapper */}
              <div className="overflow-x-auto rounded-xl border border-slate-700/80">
                <table className="w-full text-left border-collapse text-xs">
                  <thead className="bg-navy-900/90 text-slate-300 font-bold border-b border-slate-700">
                    <tr>
                      <th className="p-3">실적 → 수령연도</th>
                      <th className="p-3">영업이익</th>
                      {selectedDivisionTab === 'all' && <th className="p-3">사업부</th>}
                      <th className="p-3">OPI 총 배정액</th>
                      <th className="p-3">OPI 1 (1월 말 현금)</th>
                      <th className="p-3">OPI 2 (3월말~4월초 주식)</th>
                      <th className="p-3 text-amber-300">🔒 OPI 2 독소조항 (즉시·1년·2년)</th>
                      <th className="p-3 text-teal-300">🔓 당해 3~4월 해제 주식</th>
                      <th className="p-3 text-purple-300">🎁 PSU 약정 (10월 1/3씩)</th>
                      <th className="p-3 text-emerald-300 font-black">통장 순현금 수령액</th>
                      <th className="p-3 text-blue-300 font-black">계좌 총 보유 주식</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/60 font-medium">
                    {simulationData.years.map(yr => {
                      const yrData = simulationData.resultsByYear[yr];
                      
                      const targetDivisions = selectedDivisionTab === 'all'
                        ? simulationData.divisions
                        : simulationData.divisions.filter(d => d.key === selectedDivisionTab);

                      return targetDivisions.map((div) => {
                        const d = yrData.divisions[div.key];
                        return (
                          <tr
                            key={`${yr}-${div.key}`}
                            className="hover:bg-navy-700/50 transition"
                          >
                            <td className="p-3 font-bold text-white">
                              <div>
                                <span className="text-slate-400 text-[11px]">{d.perfYear}실적 → </span>
                                <span className="text-blue-300">{yr}년 수령</span>
                                {yrData.isHurdleMet ? (
                                  <span className="ml-1 text-[9px] text-orange-400 font-bold">🔥 100조↑</span>
                                ) : (
                                  <span className="ml-1 text-[9px] text-slate-500">100조↓</span>
                                )}
                              </div>
                              <div className="text-[10px] text-slate-400 font-normal mt-0.5">
                                연봉 {formatKoreanWon(d.yearSalaryWon)}
                                {d.isSalaryCapped && (
                                  <span className="ml-1 text-[9px] text-amber-400 font-semibold">(1.2억Cap)</span>
                                )}
                              </div>
                            </td>
                            <td className="p-3 text-slate-300">
                              <span className="font-bold text-white block">{yrData.opTrillion}조 원</span>
                              <span className="text-[10px] text-slate-400">{d.perfYear}년 영업이익</span>
                            </td>
                            {selectedDivisionTab === 'all' && (
                              <td className="p-3 font-semibold text-slate-200">
                                <span
                                  className="inline-block w-2 h-2 rounded-full mr-1.5"
                                  style={{ backgroundColor: div.color }}
                                ></span>
                                {d.divisionName}
                              </td>
                            )}
                            <td className="p-3 font-bold text-white">{formatKoreanWon(d.grossTotal)}</td>
                            <td className="p-3">
                              <span className="text-emerald-400 font-semibold block">{formatKoreanWon(d.opi1NetCash)}</span>
                              <span className="text-[10px] text-slate-400">
                                세전 {formatKoreanWon(d.opi1Gross)} (한도 {formatKoreanWon(d.yearOpi1CapWon)})
                              </span>
                            </td>
                            <td className="p-3">
                              {d.netReceivedShares > 0 ? (
                                <div>
                                  <span className="font-bold text-amber-300 block">
                                    {formatNumber(d.netReceivedShares)}주 ({formatKoreanWon(d.opi2NetStock)})
                                  </span>
                                  <span className="text-[10px] text-slate-400 block">
                                    세전 {formatNumber(d.preTaxStockShares)}주 - 세금 {formatNumber(d.taxDeductedShares)}주
                                  </span>
                                  <span className="text-[9px] text-slate-500">
                                    기준주가 {formatNumber(d.yearStockPrice)}원
                                  </span>
                                </div>
                              ) : (
                                <span className="text-slate-500">미발동</span>
                              )}
                            </td>
                            <td className="p-3">
                              {d.netReceivedShares > 0 ? (
                                <div className="space-y-0.5 text-[10px]">
                                  <div className="text-teal-300 font-semibold">
                                    • 즉시(1/3): {formatNumber(d.tranche1Shares)}주
                                  </div>
                                  <div className="text-amber-300">
                                    • 1년후({String(yr + 1).slice(2)}년): {formatNumber(d.tranche2Shares)}주
                                  </div>
                                  <div className="text-orange-400">
                                    • 2년후({String(yr + 2).slice(2)}년): {formatNumber(d.tranche3Shares)}주
                                  </div>
                                </div>
                              ) : '-'}
                            </td>
                            <td className="p-3">
                              {d.unlockedInYearShares > 0 ? (
                                <div>
                                  <span className="text-teal-300 font-bold block">
                                    🔓 {formatNumber(d.unlockedInYearShares)}주 해제
                                  </span>
                                  <span className="text-[10px] text-slate-300 block">
                                    ({formatKoreanWon(d.unlockedInYearValue)})
                                  </span>
                                  <span className="text-[9px] text-slate-400 block">
                                    당해 {formatNumber(d.tranche1Shares)}주
                                    {d.fromPrev1YrShares > 0 ? ` + 1년경과 ${formatNumber(d.fromPrev1YrShares)}주` : ''}
                                    {d.fromPrev2YrShares > 0 ? ` + 2년경과 ${formatNumber(d.fromPrev2YrShares)}주` : ''}
                                  </span>
                                </div>
                              ) : '-'}
                            </td>
                            <td className="p-3">
                              {(d.psuGrantedShares > 0 || d.psuSettleTax > 0) ? (
                                <div className="space-y-0.5">
                                  {d.psuGrantedShares > 0 && (
                                    <span className="text-purple-300 font-bold block">
                                      10월 +{formatNumber(d.psuReceivedShares)}주 ({formatKoreanWon(d.psuNetStockValue)})
                                    </span>
                                  )}
                                  {d.psuSettleTax > 0 && (
                                    <span className="text-[10px] text-red-400 block">
                                      {String(d.psuSettleFromYear).slice(2)}년 PSU 연말정산 {formatKoreanWon(d.psuSettleTax)}:
                                      {d.psuCashTaxDeduction > 0 ? ` 현금 -${formatKoreanWon(d.psuCashTaxDeduction)}` : ''}
                                      {d.psuTaxDeductedShares > 0 ? ` 주식 -${formatNumber(d.psuTaxDeductedShares)}주` : ''}
                                    </span>
                                  )}
                                </div>
                              ) : (
                                <span className="text-slate-600">-</span>
                              )}
                            </td>
                            <td className="p-3">
                              <span className="font-black text-sm text-emerald-300 block">
                                {formatKoreanWon(d.finalNetBankCash)}
                              </span>
                              <span className="text-[10px] text-slate-400">
                                OPI 1 세후{d.psuCashTaxDeduction > 0 ? ' - PSU세금' : ' (순수현금)'}
                              </span>
                            </td>
                            <td className="p-3">
                              <span className="text-blue-300 font-bold block">
                                {d.totalRetainedStockValue > 0 ? formatKoreanWon(d.totalRetainedStockValue) : '-'}
                              </span>
                              {d.totalRetainedShares > 0 && (
                                <span className="text-[10px] text-blue-400 block">
                                  총 {formatNumber(d.totalRetainedShares)}주 (OPI2 {formatNumber(d.netReceivedShares)}주{d.psuReceivedShares > 0 ? ` + PSU ${formatNumber(d.psuReceivedShares)}주` : ''})
                                </span>
                              )}
                            </td>
                          </tr>
                        );
                      });
                    })}
                  </tbody>
                </table>
              </div>
            </section>

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-navy-950 py-6 px-4 text-center text-xs text-slate-500">
            <p>
              삼성전자 성과급(OPI 1 + OPI 2 + PSU) 5개년 시뮬레이터 | 2026년 5월 성과급 제도 개편안 기준
            </p>
            <p className="mt-1 text-[11px] text-slate-600">
              OPI 2 세금(54.467%) 주식 수 선공제 후 45.533% 입고 (즉시 1/3 · 1년후 1/3 · 2년후 1/3 매도제한 독소조항 반영) | PSU CL2 400주 / CL3·4 600주 1/3씩 분할 수령
            </p>
          </footer>

        </div>
      );
    }

    // React 18 DOM Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
