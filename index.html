  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useMemo } = React;

    // ==========================================
    // 유틸리티 함수: 한국 원화 및 수치 포맷팅
    // ==========================================
    function formatKoreanWon(amount) {
      if (amount === 0 || isNaN(amount)) return '0원';
      const isNegative = amount < 0;
      const abs = Math.abs(Math.round(amount));
      
      const eok = Math.floor(abs / 100000000);
      const man = Math.floor((abs % 100000000) / 10000);
      const rest = Math.round(abs % 10000);
      
      let parts = [];
      if (eok > 0) parts.push(`${eok.toLocaleString()}억`);
      if (man > 0) parts.push(`${man.toLocaleString()}만`);
      if (parts.length === 0 && rest > 0) parts.push(`${rest.toLocaleString()}`);
      
      const res = (isNegative ? '-' : '') + parts.join(' ') + ' 원';
      return res.trim();
    }

    function formatNumber(val) {
      if (val === null || val === undefined || isNaN(val)) return '0';
      return Math.round(val).toLocaleString();
    }

    // ==========================================
    // 세금 계산 로직
    // ==========================================
    // 근로소득공제 (총급여액 기준)
    function calcEarnedIncomeDeduction(totalSalary) {
      if (totalSalary <= 5000000) return totalSalary * 0.7;
      if (totalSalary <= 15000000) return 3500000 + (totalSalary - 5000000) * 0.4;
      if (totalSalary <= 45000000) return 7500000 + (totalSalary - 15000000) * 0.15;
      if (totalSalary <= 100000000) return 12000000 + (totalSalary - 45000000) * 0.05;
      const ded = 14750000 + (totalSalary - 100000000) * 0.02;
      return Math.min(ded, 20000000); // 법정 최고 한도 2천만 원
    }

    // 대한민국 종합소득세 과세표준 구간 산출세액 (2024~2026 현행)
    function calcBaseIncomeTax(taxableIncome) {
      if (taxableIncome <= 0) return 0;
      if (taxableIncome <= 14000000) return taxableIncome * 0.06;
      if (taxableIncome <= 50000000) return taxableIncome * 0.15 - 1260000;
      if (taxableIncome <= 88000000) return taxableIncome * 0.24 - 5760000;
      if (taxableIncome <= 150000000) return taxableIncome * 0.35 - 15440000;
      if (taxableIncome <= 300000000) return taxableIncome * 0.38 - 19940000;
      if (taxableIncome <= 500000000) return taxableIncome * 0.40 - 25940000;
      if (taxableIncome <= 1000000000) return taxableIncome * 0.42 - 35940000;
      return taxableIncome * 0.45 - 65940000;
    }

    // OPI 1 정밀 한계세액 계산
    function calcOPI1Tax(baseSalary, opi1Gross) {
      if (opi1Gross <= 0) {
        return { incomeTax: 0, localTax: 0, healthTax: 0, totalTax: 0, netCash: 0, effectiveRate: 0, taxBracket: '0%' };
      }
      const personalDed = 1500000; // 본인 기본 인적공제
      
      // 1. 기본급여만 있을 때 과세표준 & 산출세액
      const ded1 = calcEarnedIncomeDeduction(baseSalary);
      const taxBase1 = Math.max(0, baseSalary - ded1 - personalDed);
      const tax1 = calcBaseIncomeTax(taxBase1);
      
      // 2. 기본급여 + OPI 1 합산 총급여 과세표준 & 산출세액
      const totalGross = baseSalary + opi1Gross;
      const ded2 = calcEarnedIncomeDeduction(totalGross);
      const taxBase2 = Math.max(0, totalGross - ded2 - personalDed);
      const tax2 = calcBaseIncomeTax(taxBase2);
      
      // 한계 소득세
      const marginalIncomeTax = Math.max(0, tax2 - tax1);
      // 지방소득세 10%
      const localTax = marginalIncomeTax * 0.10;
      // 건강보험료 (요청 지정값 4.967%)
      const healthTax = opi1Gross * 0.04967;
      
      const totalTax = marginalIncomeTax + localTax + healthTax;
      const netCash = opi1Gross - totalTax;
      const effectiveRate = opi1Gross > 0 ? (totalTax / opi1Gross) * 100 : 0;
      
      let taxBracket = '6%';
      if (taxBase2 > 1000000000) taxBracket = '45%';
      else if (taxBase2 > 500000000) taxBracket = '42%';
      else if (taxBase2 > 300000000) taxBracket = '40%';
      else if (taxBase2 > 150000000) taxBracket = '38%';
      else if (taxBase2 > 88000000) taxBracket = '35%';
      else if (taxBase2 > 50000000) taxBracket = '24%';
      else if (taxBase2 > 14000000) taxBracket = '15%';

      return {
        marginalIncomeTax,
        localTax,
        healthTax,
        totalTax,
        netCash,
        effectiveRate,
        taxBracket,
        taxBase2
      };
    }

    // OPI 2 세금 계산 (최고세율 54.467% 주식으로 선공제 -> 45.533% 세후 주식 수령)
    function calcOPI2Tax(opi2Gross) {
      if (opi2Gross <= 0) {
        return {
          incomeTax: 0,
          localTax: 0,
          healthTax: 0,
          totalTax: 0,
          netStockValue: 0,
          effectiveRate: 54.467
        };
      }
      const incomeTax = opi2Gross * 0.45;
      const localTax = opi2Gross * 0.045;
      const healthTax = opi2Gross * 0.04967;
      const totalTax = opi2Gross * 0.54467;
      const netStockValue = opi2Gross * 0.45533;
      return {
        incomeTax,
        localTax,
        healthTax,
        totalTax,
        netStockValue,
        effectiveRate: 54.467
      };
    }

    // ==========================================
    // 기본 시나리오 프리셋 정의
    // ==========================================
    const SCENARIOS = {
      default: {
        name: '기본 시나리오 (85~150조)',
        description: '27년 100조 이하 조정 후 28년부터 100조 돌파 지속 성장',
        profits: { 2027: 85, 2028: 115, 2029: 130, 2030: 140, 2031: 150 }
      },
      supercycle: {
        name: '🔥 슈퍼사이클 (105~180조)',
        description: 'AI 반도체 HBM 폭발적 수요로 5개년 전 기간 100조 초과 달성',
        profits: { 2027: 105, 2028: 125, 2029: 145, 2030: 165, 2031: 180 }
      },
      conservative: {
        name: '🛡️ 보수적 시나리오 (70~115조)',
        description: '반도체 다운턴 및 경쟁 심화로 2030년 이후에야 100조 돌파',
        profits: { 2027: 70, 2028: 85, 2029: 95, 2030: 105, 2031: 115 }
      },
      boom: {
        name: '⚡ 초호황 시나리오 (120~200조)',
        description: '메모리 독점적 호황으로 사상 최대 영업이익 지속 경신',
        profits: { 2027: 120, 2028: 140, 2029: 160, 2030: 180, 2031: 200 }
      },
      megacycle: {
        name: '🌌 메가사이클 (300~1,000조)',
        description: '글로벌 AI 인프라 독점으로 영업이익 최대 1,000조 원 도달 시나리오',
        profits: { 2027: 300, 2028: 450, 2029: 600, 2030: 800, 2031: 1000 }
      }
    };

    // ==========================================
    // 메인 리액트 컴포넌트
    // ==========================================
    function App() {
      // 1. 사용자 입력 파라미터 상태
      const [headcounts, setHeadcounts] = useState({
        memory: 32500,
        common: 22500,
        nonMemory: 22500
      });
      const [baseSalaryManwon, setBaseSalaryManwon] = useState(10000); // 10,000만 원 (1억 원)
      const [stockPrice, setStockPrice] = useState(80000); // 삼성전자 주가 (기본 80,000원)

      // 5개년 연도별 영업이익 (조 원)
      const [opProfits, setOpProfits] = useState(SCENARIOS.default.profits);
      const [selectedScenarioKey, setSelectedScenarioKey] = useState('default');

      // 재원 및 배분 수식 옵션 상태
      // allocationMode: 'separated' (해석 1 분리형) vs 'overlapping' (해석 2 중첩형)
      const [allocationMode, setAllocationMode] = useState('separated');
      // separatedWeightType: 'weighted' (38,250명 가중완전배분) vs 'simple' (45,000명 단순균등 후 70%)
      const [separatedWeightType, setSeparatedWeightType] = useState('weighted');
      // opi2Mode: 'deduction' (방식 1: 통합 차감형) vs 'excess' (방식 2: 100조 초과 순수 분리형)
      const [opi2Mode, setOpi2Mode] = useState('deduction');

      // UI 탭 및 모달 상태
      const [selectedDivisionTab, setSelectedDivisionTab] = useState('all'); // 'all', 'memory', 'common', 'nonMemory'
      const [showInfoModal, setShowInfoModal] = useState(false);
      const [toastMsg, setToastToast] = useState('');

      const showToast = (msg) => {
        setToastToast(msg);
        setTimeout(() => setToastToast(''), 3000);
      };

      // 시나리오 프리셋 변경 핸들러
      const handleSelectScenario = (key) => {
        setSelectedScenarioKey(key);
        setOpProfits({ ...SCENARIOS[key].profits });
        showToast(`'${SCENARIOS[key].name}' 프리셋이 적용되었습니다.`);
      };

      const baseSalaryWon = baseSalaryManwon * 10000;
      const opi1CapWon = baseSalaryWon * 0.5; // OPI 1 개인별 최대 한도 (연봉 50%)

      // ==========================================
      // 핵심 연산: 5개년 연도별 & 사업부별 시뮬레이션 계산
      // ==========================================
      const simulationData = useMemo(() => {
        const years = [2027, 2028, 2029, 2030, 2031];
        const divisions = [
          { key: 'memory', name: '메모리사업부', count: headcounts.memory, color: '#3B82F6' },
          { key: 'common', name: '공통부서', count: headcounts.common, color: '#10B981' },
          { key: 'nonMemory', name: '비메모리사업부', count: headcounts.nonMemory, color: '#F59E0B' }
        ];

        const resultsByYear = {};

        years.forEach(year => {
          const opTrillion = opProfits[year] || 0;
          const opWon = opTrillion * 1000000000000; // 조 -> 원
          const totalPoolWon = opWon * 0.105; // 10.5% 전체 재원
          const isHurdleMet = opTrillion > 100; // OPI 2 발동 조건: 100조 초과

          // 1. 배분 모드에 따른 사업부별 1인당 Gross 배정액 산출
          let grossAllocation = {};

          if (allocationMode === 'separated') {
            // [해석 1 - 분리형]
            const memoryPool = totalPoolWon * 0.6; // 60%
            const commonNonMemPool = totalPoolWon * 0.4; // 40%

            grossAllocation.memory = headcounts.memory > 0 ? (memoryPool / headcounts.memory) : 0;

            if (separatedWeightType === 'weighted') {
              const weightedUsers = (headcounts.common * 0.7) + (headcounts.nonMemory * 1.0);
              const nonMemUnit = weightedUsers > 0 ? (commonNonMemPool / weightedUsers) : 0;
              grossAllocation.nonMemory = nonMemUnit;
              grossAllocation.common = nonMemUnit * 0.7;
            } else {
              const totalCommonUsers = headcounts.common + headcounts.nonMemory;
              const unit = totalCommonUsers > 0 ? (commonNonMemPool / totalCommonUsers) : 0;
              grossAllocation.nonMemory = unit * 1.0;
              grossAllocation.common = unit * 0.7;
            }
          } else {
            // [해석 2 - 중첩형]
            const memDedicatedUnit = headcounts.memory > 0 ? (totalPoolWon * 0.6) / headcounts.memory : 0;
            const totalAllUsers = headcounts.memory + headcounts.common + headcounts.nonMemory;
            const commonSharedUnit = totalAllUsers > 0 ? (totalPoolWon * 0.4) / totalAllUsers : 0;

            grossAllocation.memory = (memDedicatedUnit * 1.0) + (commonSharedUnit * 0.7);
            grossAllocation.common = commonSharedUnit * 0.7;
            grossAllocation.nonMemory = commonSharedUnit * 1.0;
          }

          // 2. 100조 초과 순수 분리형(방식 2) 계산용 추가 배분액
          let grossExcessAllocation = {};
          if (opi2Mode === 'excess') {
            if (isHurdleMet) {
              const excessOpWon = (opTrillion - 100) * 1000000000000;
              const excessPoolWon = excessOpWon * 0.105;

              if (allocationMode === 'separated') {
                const memPoolEx = excessPoolWon * 0.6;
                const comPoolEx = excessPoolWon * 0.4;
                grossExcessAllocation.memory = headcounts.memory > 0 ? (memPoolEx / headcounts.memory) : 0;
                if (separatedWeightType === 'weighted') {
                  const weightedUsers = (headcounts.common * 0.7) + (headcounts.nonMemory * 1.0);
                  const nonMemEx = weightedUsers > 0 ? (comPoolEx / weightedUsers) : 0;
                  grossExcessAllocation.nonMemory = nonMemEx;
                  grossExcessAllocation.common = nonMemEx * 0.7;
                } else {
                  const totalCommonUsers = headcounts.common + headcounts.nonMemory;
                  const unitEx = totalCommonUsers > 0 ? (comPoolEx / totalCommonUsers) : 0;
                  grossExcessAllocation.nonMemory = unitEx;
                  grossExcessAllocation.common = unitEx * 0.7;
                }
              } else {
                const memUnitEx = headcounts.memory > 0 ? (excessPoolWon * 0.6) / headcounts.memory : 0;
                const totalAllUsers = headcounts.memory + headcounts.common + headcounts.nonMemory;
                const comUnitEx = totalAllUsers > 0 ? (excessPoolWon * 0.4) / totalAllUsers : 0;
                grossExcessAllocation.memory = memUnitEx + (comUnitEx * 0.7);
                grossExcessAllocation.common = comUnitEx * 0.7;
                grossExcessAllocation.nonMemory = comUnitEx * 1.0;
              }
            } else {
              grossExcessAllocation = { memory: 0, common: 0, nonMemory: 0 };
            }
          }

          // 사업부별 상세 계산
          const divResults = {};
          divisions.forEach(div => {
            const gross = grossAllocation[div.key] || 0;

            // OPI 1 (현금): 연봉의 50% Cap 적용
            const opi1Gross = Math.min(gross, opi1CapWon);
            const opi1TaxInfo = calcOPI1Tax(baseSalaryWon, opi1Gross);

            // OPI 2 (주식):
            let opi2Gross = 0;
            if (isHurdleMet) {
              if (opi2Mode === 'deduction') {
                opi2Gross = Math.max(0, gross - opi1Gross);
              } else {
                opi2Gross = grossExcessAllocation[div.key] || 0;
              }
            } else {
              opi2Gross = 0; // 100조 이하 미발동
            }

            const opi2TaxInfo = calcOPI2Tax(opi2Gross);

            // 주식 수 산출:
            // 세전 배정 주식 수
            const preTaxStockShares = stockPrice > 0 ? Math.floor(opi2Gross / stockPrice) : 0;
            // 세금(54.467%)만큼 주식 수를 차감하고 실제 계좌에 입고되는 세후 순주식 수 (45.533%)
            const netReceivedShares = stockPrice > 0 ? Math.floor(opi2TaxInfo.netStockValue / stockPrice) : 0;
            const taxDeductedShares = Math.max(0, preTaxStockShares - netReceivedShares);

            // 입고된 세후 순주식(45.533%)의 1/3 매도 현금화 및 2/3 보유 계산
            const stockSellCash = opi2TaxInfo.netStockValue * (1 / 3);
            const stockSellShares = Math.floor(netReceivedShares / 3);
            const retainedStockValue = opi2TaxInfo.netStockValue * (2 / 3);
            const retainedStockShares = netReceivedShares - stockSellShares;

            // 최종 통장 수령 현금 = OPI 1 세후 현금 + 세후 주식 1/3 매도 현금화액
            const finalNetBankCash = opi1TaxInfo.netCash + stockSellCash;

            // 총 세후 실수령 가치 (통장 현금 + 2/3 보유 주식 가치 = OPI 1 세후 + OPI 2 세후)
            const totalCombinedValue = finalNetBankCash + retainedStockValue;
            const totalTaxesPaid = opi1TaxInfo.totalTax + opi2TaxInfo.totalTax;

            divResults[div.key] = {
              divisionName: div.name,
              grossTotal: gross,
              opi1Gross,
              opi1Tax: opi1TaxInfo.totalTax,
              opi1NetCash: opi1TaxInfo.netCash,
              opi1TaxRate: opi1TaxInfo.effectiveRate,
              opi1TaxBracket: opi1TaxInfo.taxBracket,
              opi2Gross,
              opi2Tax: opi2TaxInfo.totalTax,
              opi2NetStock: opi2TaxInfo.netStockValue,
              preTaxStockShares,
              taxDeductedShares,
              netReceivedShares,
              stockSellCash,
              stockSellShares,
              finalNetBankCash,
              retainedStockValue,
              retainedStockShares,
              totalCombinedValue,
              totalTaxesPaid
            };
          });

          resultsByYear[year] = {
            year,
            opTrillion,
            opWon,
            totalPoolWon,
            isHurdleMet,
            divisions: divResults
          };
        });

        // 5개년 누적 합계 (Cumulative Totals)
        const cumulativeByDivision = {};
        divisions.forEach(div => {
          let sumGrossTotal = 0;
          let sumOpi1Gross = 0;
          let sumOpi1Tax = 0;
          let sumOpi1Net = 0;
          let sumOpi2Gross = 0;
          let sumOpi2Tax = 0;
          let sumOpi2Net = 0;
          let sumStockSellCash = 0;
          let sumFinalNetCash = 0;
          let sumRetainedStock = 0;
          let sumTotalTaxes = 0;
          let sumPreTaxShares = 0;
          let sumTaxDeductedShares = 0;
          let sumNetReceivedShares = 0;
          let sumRetainedShares = 0;
          let sumSoldShares = 0;

          years.forEach(yr => {
            const data = resultsByYear[yr].divisions[div.key];
            sumGrossTotal += data.grossTotal;
            sumOpi1Gross += data.opi1Gross;
            sumOpi1Tax += data.opi1Tax;
            sumOpi1Net += data.opi1NetCash;
            sumOpi2Gross += data.opi2Gross;
            sumOpi2Tax += data.opi2Tax;
            sumOpi2Net += data.opi2NetStock;
            sumStockSellCash += data.stockSellCash;
            sumFinalNetCash += data.finalNetBankCash;
            sumRetainedStock += data.retainedStockValue;
            sumTotalTaxes += data.totalTaxesPaid;
            sumPreTaxShares += data.preTaxStockShares;
            sumTaxDeductedShares += data.taxDeductedShares;
            sumNetReceivedShares += data.netReceivedShares;
            sumRetainedShares += data.retainedStockShares;
            sumSoldShares += data.stockSellShares;
          });

          cumulativeByDivision[div.key] = {
            divisionName: div.name,
            headcount: div.count,
            color: div.color,
            sumGrossTotal,
            sumOpi1Gross,
            sumOpi1Tax,
            sumOpi1Net,
            sumOpi2Gross,
            sumOpi2Tax,
            sumOpi2Net,
            sumStockSellCash,
            sumFinalNetCash,
            sumRetainedStock,
            sumTotalTaxes,
            sumPreTaxShares,
            sumTaxDeductedShares,
            sumNetReceivedShares,
            sumRetainedShares,
            sumSoldShares,
            totalCombined: sumFinalNetCash + sumRetainedStock
          };
        });

        return {
          years,
          divisions,
          resultsByYear,
          cumulativeByDivision
        };
      }, [headcounts, baseSalaryWon, stockPrice, opProfits, allocationMode, separatedWeightType, opi2Mode, opi1CapWon]);

      // CSV 데이터 다운로드 핸들러
      const handleExportCSV = () => {
        let csv = '\uFEFF'; // Excel UTF-8 BOM

                      <th className="p-3">입고 주식수 (세금차감 후)</th>
                      <th className="p-3">세후주식 1/3 매도액</th>
                      <th className="p-3 text-emerald-300 font-black">통장 최종 현금</th>
                      <th className="p-3 text-blue-300 font-black">계좌 보유 주식(2/3)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/60 font-medium">
                    {simulationData.years.map(yr => {
                      const yrData = simulationData.resultsByYear[yr];
                      
                      const targetDivisions = selectedDivisionTab === 'all'
                        ? simulationData.divisions
                        : simulationData.divisions.filter(d => d.key === selectedDivisionTab);

                      return targetDivisions.map((div) => {
                        const d = yrData.divisions[div.key];
                        return (
                          <tr
                            key={`${yr}-${div.key}`}
                            className="hover:bg-navy-700/50 transition"
                          >
                            <td className="p-3 font-bold text-white">
                              {yr}년
                              {yrData.isHurdleMet ? (
                                <span className="ml-1 text-[9px] text-orange-400 font-bold">🔥 100조↑</span>
                              ) : (
                                <span className="ml-1 text-[9px] text-slate-500">100조↓</span>
                              )}
                            </td>
                            <td className="p-3 text-slate-300">{yrData.opTrillion}조 원</td>
                            {selectedDivisionTab === 'all' && (
                              <td className="p-3 font-semibold text-slate-200">
                                <span
                                  className="inline-block w-2 h-2 rounded-full mr-1.5"
                                  style={{ backgroundColor: div.color }}
                                ></span>
                                {d.divisionName}
                              </td>
                            )}
                            <td className="p-3 font-bold text-white">{formatKoreanWon(d.grossTotal)}</td>
                            <td className="p-3">
                              <span className="text-emerald-400 font-semibold block">{formatKoreanWon(d.opi1NetCash)}</span>
                              <span className="text-[10px] text-slate-400">세전 {formatKoreanWon(d.opi1Gross)}</span>
                            </td>
                            <td className="p-3">
                              <span className="text-amber-400 font-semibold block">
                                {d.opi2Gross > 0 ? formatKoreanWon(d.opi2NetStock) : '-'}
                              </span>
                              <span className="text-[10px] text-slate-400">
                                {d.opi2Gross > 0 ? `세전 ${formatKoreanWon(d.opi2Gross)}` : '미발동'}
                              </span>
                            </td>
                            <td className="p-3">
                              {d.netReceivedShares > 0 ? (
                                <div>
                                  <span className="font-bold text-white block">{formatNumber(d.netReceivedShares)}주 입고</span>
                                  <span className="text-[10px] text-slate-400">
                                    (세전 {formatNumber(d.preTaxStockShares)}주 - 세금 {formatNumber(d.taxDeductedShares)}주)
                                  </span>
                                </div>
                              ) : '-'}
                            </td>
                            <td className="p-3">
                              {d.stockSellCash > 0 ? (
                                <div>
                                  <span className="text-white font-semibold block">{formatKoreanWon(d.stockSellCash)}</span>
                                  <span className="text-[10px] text-slate-400">{formatNumber(d.stockSellShares)}주 매도</span>
                                </div>
                              ) : '-'}
                            </td>
                            <td className="p-3">
                              <span className="font-black text-sm text-emerald-300 block">
                                {formatKoreanWon(d.finalNetBankCash)}
                              </span>
                              <span className="text-[10px] text-slate-400">OPI 1 + 1/3매도</span>
                            </td>
                            <td className="p-3">
                              <span className="text-blue-300 font-bold block">
                                {d.retainedStockValue > 0 ? formatKoreanWon(d.retainedStockValue) : '-'}
                              </span>
                              {d.retainedStockShares > 0 && (
                                <span className="text-[10px] text-blue-400 block">
                                  {formatNumber(d.retainedStockShares)}주 보유
                                </span>
                              )}
                            </td>
                          </tr>
                        );
                      });
                    })}
                  </tbody>
                </table>
              </div>
            </section>

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-navy-950 py-6 px-4 text-center text-xs text-slate-500">
            <p>
              삼성전자 성과급(OPI 1 + OPI 2) 5개년 시뮬레이터 | 2026년 5월 성과급 제도 개편안 기준
            </p>
            <p className="mt-1 text-[11px] text-slate-600">
              OPI 1 근로소득 누진세율 원천징수 및 OPI 2 세금(54.467%) 주식 수 선공제 후 45.533% 세후 주식 입고 기준
            </p>
          </footer>

        </div>
      );
    }

    // React 18 DOM Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
